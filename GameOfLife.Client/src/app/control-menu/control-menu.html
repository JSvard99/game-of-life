<div class="flex-container">
  <div class="left">
    <button (click)="randomizeGrid()" [disabled]="gridService.isPlaying" class="shuffle-button">
      <span class="material-symbols-rounded">shuffle</span>
    </button>

    <button (click)="clearGrid()" [disabled]="gridService.isPlaying" class="clear-button">
      <span class="material-symbols-rounded">delete</span>
    </button>
  </div>

  <div class="center">
    <button (click)="toggleAutoUpdate()"
            [ngClass]="{'play-button': !gridService.isPlaying, 'stop-button': gridService.isPlaying}">
      @if (!gridService.isPlaying) {
        <span class="material-symbols-rounded">play_arrow</span>
      } @else {
        <span class="material-symbols-rounded">stop</span>
      }
    </button>
  </div>

  <div class="right">
    <button (click)="updateGrid()" [disabled]="gridService.isPlaying" class="next-button">
      <span class="material-symbols-rounded">skip_next</span>
    </button>
  </div>
</div>
