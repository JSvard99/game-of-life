<button (click)="randomizeGrid()" [disabled]="gridService.isPlaying">Randomize</button>

<button (click)="clearGrid()" [disabled]="gridService.isPlaying">Clear</button>

<button (click)="toggleAutoUpdate()">
  @if (!gridService.isPlaying) {
    Play
  } @else {
    Stop
  }
</button>

<button (click)="updateGrid()" [disabled]="gridService.isPlaying">Next</button>
