<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=delete,play_arrow,shuffle,skip_next,stop"/>

<button (click)="randomizeGrid()" [disabled]="gridService.isPlaying" id="shuffle-button">
  <span class="material-symbols-rounded">shuffle</span>
</button>

<button (click)="clearGrid()" [disabled]="gridService.isPlaying">
  <span class="material-symbols-rounded">delete</span>
</button>

<button (click)="toggleAutoUpdate()">
  @if (!gridService.isPlaying) {
    <span class="material-symbols-rounded">play_arrow</span>
  } @else {
    <span class="material-symbols-rounded">stop</span>
  }
</button>

<button (click)="updateGrid()" [disabled]="gridService.isPlaying">
  <span class="material-symbols-rounded">skip_next</span>
</button>
