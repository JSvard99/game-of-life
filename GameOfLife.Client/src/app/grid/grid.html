<table>
    @for (row of grid(); track $index; let rowIndex = $index) {
      <tr>
      @for (column of row; track $index; let columnIndex = $index) {
        <td [class.alive]="grid()[rowIndex][columnIndex]"><div (click)="switchCellState(rowIndex, columnIndex)"
                                                               class="cell"></div></td>
      }
      </tr>
    }
</table>
